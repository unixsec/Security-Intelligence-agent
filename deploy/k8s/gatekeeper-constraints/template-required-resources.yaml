apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8srequiredresources
spec:
  crd:
    spec:
      names:
        kind: K8sRequiredResources
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8srequiredresources

        violation[{"msg": msg}] {
          c := input.review.object.spec.containers[_]
          required := {"cpu", "memory"}
          provided := {k | c.resources.requests[k]}
          missing := required - provided
          count(missing) > 0
          msg := sprintf("container %q missing resources.requests: %v", [c.name, missing])
        }

        violation[{"msg": msg}] {
          c := input.review.object.spec.containers[_]
          required := {"cpu", "memory"}
          provided := {k | c.resources.limits[k]}
          missing := required - provided
          count(missing) > 0
          msg := sprintf("container %q missing resources.limits: %v", [c.name, missing])
        }
