{{- /*
  Legacy inline Secret template.
  DEFAULT: disabled. `configure.sh` renders `deploy/rendered/sia-secrets.yaml`
  separately and `deploy-k8s.sh` applies it via `kubectl apply -f`.

  Enable only if you want Helm to manage the Secret resource directly
  (e.g. emergency manual install without configure.sh):
    --set secrets.manageInChart=true \
    --set secrets.jwtSecret=... --set secrets.apiKey=... ...

  NEVER commit a values file that contains real secret values.
*/}}
{{- if .Values.secrets.manageInChart }}
apiVersion: v1
kind: Secret
metadata:
  name: sia-secrets
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "sia.labels" . | nindent 4 }}
type: Opaque
stringData:
  SIA_AUTH_JWT_SECRET: {{ required ".Values.secrets.jwtSecret is required when manageInChart=true" .Values.secrets.jwtSecret | quote }}
  SIA_AUTH_JWT_ALGORITHM: {{ .Values.secrets.jwtAlgorithm | default "HS256" | quote }}
  {{- if .Values.secrets.jwtPrivateKey }}
  SIA_AUTH_JWT_PRIVATE_KEY: {{ .Values.secrets.jwtPrivateKey | quote }}
  {{- end }}
  {{- if .Values.secrets.jwtPublicKey }}
  SIA_AUTH_JWT_PUBLIC_KEY: {{ .Values.secrets.jwtPublicKey | quote }}
  {{- end }}
  SIA_API_KEY: {{ required ".Values.secrets.apiKey is required when manageInChart=true" .Values.secrets.apiKey | quote }}
  SIA_MYSQL_PASSWORD: {{ required ".Values.secrets.mysqlPassword is required when manageInChart=true" .Values.secrets.mysqlPassword | quote }}
  SIA_REDIS_PASSWORD: {{ .Values.secrets.redisPassword | quote }}
  SIA_MINIO_ACCESS_KEY: {{ .Values.secrets.minioAccessKey | default "" | quote }}
  SIA_MINIO_SECRET_KEY: {{ .Values.secrets.minioSecretKey | default "" | quote }}
  SIA_MILVUS_TOKEN: {{ .Values.secrets.milvusToken | default "" | quote }}
  SIA_GOOGLE_API_KEY: {{ .Values.secrets.googleApiKey | default "" | quote }}
  SIA_ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | default "" | quote }}
  SIA_OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | default "" | quote }}
  {{- if .Values.secrets.adminPassword }}
  SIA_ADMIN_PASSWORD: {{ .Values.secrets.adminPassword | quote }}
  {{- end }}
{{- end }}
