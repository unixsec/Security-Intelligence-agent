{{- /*
DEP-3: Pod Security Standards (PSA) enforcement.

The ``restricted`` profile rejects pods that:
  - run as root
  - mount the host filesystem
  - request privilege escalation
  - lack a runtime/default seccomp profile
  - run with non-default capabilities

SIA's pod specs already match this profile (see api-deployment.yaml /
consumer-deployment.yaml / web-deployment.yaml), so labelling the namespace
catches future drift rather than blocking the current install.

Helm does not own pre-existing namespaces; we render this manifest only
when the operator has set ``namespaceManagedByHelm: true`` (default false
for backwards compatibility with the existing kubectl-create flow in
deploy-k8s.sh).
*/ -}}
{{- if .Values.namespaceManagedByHelm | default false }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace }}
  labels:
    {{- include "sia.labels" . | nindent 4 }}
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
{{- end }}
