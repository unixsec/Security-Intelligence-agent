{{- if .Values.ingress.enabled }}
{{- /*
DEP-1: production deployments must terminate TLS at the ingress.
Override only when running an offline/internal cluster where TLS is
provided by an upstream LB (and re-enable on the LB instead).
*/ -}}
{{- if and (eq .Values.config.env "production") (not .Values.ingress.tls.enabled) }}
{{- fail "ingress.tls.enabled is false with config.env=production. Configure ingress.tls.secretName (cert-manager works well) before deploying." }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sia-ingress
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "sia.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: sia-api
                port:
                  number: {{ .Values.api.service.port }}
          {{- if .Values.web.enabled }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sia-web
                port:
                  number: {{ .Values.web.service.port }}
          {{- end }}
{{- end }}
