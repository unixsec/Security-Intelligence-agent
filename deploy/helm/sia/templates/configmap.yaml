apiVersion: v1
kind: ConfigMap
metadata:
  name: sia-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "sia.labels" . | nindent 4 }}
data:
  # -- Application --------------------------------------------------------
  SIA_ENV: {{ .Values.config.env | quote }}
  SIA_DEBUG: "false"
  SIA_LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  SIA_LOG_JSON_FORMAT: {{ .Values.observability.logJsonFormat | default true | quote }}
  SIA_API_HOST: {{ .Values.config.apiHost | quote }}
  SIA_API_PORT: {{ .Values.config.apiPort | quote }}
  SIA_PROMPTS_DIR: {{ .Values.config.promptsDir | quote }}
  SIA_WORKFLOWS_DIR: {{ .Values.config.workflowsDir | quote }}
  SIA_CONFIG_DIR: {{ .Values.config.configDir | quote }}
  SIA_AUTH_JWT_ALGORITHM: {{ .Values.config.jwtAlgorithm | default "HS256" | quote }}
  SIA_OTLP_ENDPOINT: {{ .Values.observability.otlpEndpoint | default "" | quote }}
  # -- MySQL --------------------------------------------------------------
  SIA_MYSQL_HOST: {{ .Values.mysql.host | quote }}
  SIA_MYSQL_PORT: {{ .Values.mysql.port | quote }}
  SIA_MYSQL_USER: {{ .Values.mysql.user | quote }}
  SIA_MYSQL_DATABASE: {{ .Values.mysql.database | quote }}
  SIA_MYSQL_POOL_SIZE: {{ .Values.mysql.poolSize | default "10" | quote }}
  SIA_MYSQL_TLS_MODE: {{ .Values.mysql.tls.mode | default "disabled" | quote }}
  {{- if .Values.mysql.tls.caSecretName }}
  SIA_MYSQL_TLS_CA_PATH: "/etc/sia/tls/mysql/ca.crt"
  {{- end }}
  # -- Redis --------------------------------------------------------------
  SIA_REDIS_HOST: {{ .Values.redis.host | quote }}
  SIA_REDIS_PORT: {{ .Values.redis.port | quote }}
  SIA_REDIS_DB: {{ .Values.redis.db | quote }}
  SIA_REDIS_TLS_ENABLED: {{ .Values.redis.tls.enabled | default false | quote }}
  {{- if and .Values.redis.tls.enabled .Values.redis.tls.caSecretName }}
  SIA_REDIS_TLS_CA_PATH: "/etc/sia/tls/redis/ca.crt"
  {{- end }}
  # -- Milvus -------------------------------------------------------------
  SIA_MILVUS_HOST: {{ .Values.milvus.host | quote }}
  SIA_MILVUS_PORT: {{ .Values.milvus.port | quote }}
  SIA_MILVUS_COLLECTION_NAME: {{ .Values.milvus.collectionName | default "intel_vectors" | quote }}
  # -- MinIO --------------------------------------------------------------
  SIA_MINIO_ENABLED: {{ .Values.minio.enabled | default true | quote }}
  SIA_MINIO_HOST: {{ .Values.minio.host | default "" | quote }}
  SIA_MINIO_PORT: {{ .Values.minio.port | default 9000 | quote }}
  SIA_MINIO_BUCKET: {{ .Values.minio.bucket | default "sia-reports" | quote }}
  SIA_MINIO_SECURE: {{ .Values.minio.secure | default true | quote }}
