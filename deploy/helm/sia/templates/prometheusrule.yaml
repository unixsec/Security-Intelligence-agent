{{- /*
v0.4-6 — PrometheusRule defining the SIA SLI / SLO / burn-rate alerts.

SLOs (28-day window):
  - Availability:  99.9%   (request error budget = 0.1%)
  - Read latency:  p95 < 200 ms
  - Pipeline e2e:  median collected→analyzed < 5 min

Burn rate alerts (Google SRE workbook):
  - 14.4× burn over 1h  → page  (consumes 2% budget in 1h = 5%/day)
  - 6×    burn over 6h  → page  (consumes 5% budget in 6h)
  - 1×    burn over 3d  → ticket
*/ -}}
{{- if .Values.observability.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: sia-slo
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "sia.labels" . | nindent 4 }}
    {{- with .Values.observability.prometheusRule.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: sia.slo.records
      interval: 30s
      rules:
        # Total successful + failed HTTP requests on the API
        - record: sia:api_requests:rate5m
          expr: sum(rate(http_requests_total{job="sia-api"}[5m]))
        - record: sia:api_errors:rate5m
          expr: sum(rate(http_requests_total{job="sia-api",code=~"5.."}[5m]))
        # Error ratio — comparable to budget thresholds.
        - record: sia:api_error_ratio:5m
          expr: sia:api_errors:rate5m / clamp_min(sia:api_requests:rate5m, 1)
        - record: sia:api_error_ratio:1h
          expr: |
            sum(rate(http_requests_total{job="sia-api",code=~"5.."}[1h]))
            / clamp_min(sum(rate(http_requests_total{job="sia-api"}[1h])), 1)
        - record: sia:api_error_ratio:6h
          expr: |
            sum(rate(http_requests_total{job="sia-api",code=~"5.."}[6h]))
            / clamp_min(sum(rate(http_requests_total{job="sia-api"}[6h])), 1)

        # LLM call error ratio — separately tracked (not budgeted, just monitored).
        - record: sia:llm_error_ratio:5m
          expr: |
            sum(rate(sia_llm_call_total{result="error"}[5m]))
            / clamp_min(sum(rate(sia_llm_call_total[5m])), 1)

    - name: sia.slo.alerts
      rules:
        # ── Availability burn (multi-window, multi-burn-rate) ───────────
        - alert: SIAErrorBudgetBurnFast
          expr: sia:api_error_ratio:1h > (14.4 * 0.001)
          for: 5m
          labels:
            severity: page
            slo: availability
          annotations:
            summary: "SIA API burning error budget at 14.4×"
            description: "5xx ratio over the last 1h is consuming the monthly error budget at 14.4× the sustainable rate. At this pace the entire 28-day budget burns in 2 days."

        - alert: SIAErrorBudgetBurnSlow
          expr: sia:api_error_ratio:6h > (6 * 0.001)
          for: 30m
          labels:
            severity: page
            slo: availability
          annotations:
            summary: "SIA API burning error budget at 6×"
            description: "5xx ratio over the last 6h is at 6× the sustainable rate."

        # ── Latency SLO ────────────────────────────────────────────────
        - alert: SIAReadLatencyP95High
          expr: |
            histogram_quantile(0.95,
              sum by (le)(rate(http_request_duration_seconds_bucket{job="sia-api",method="GET"}[5m]))
            ) > 0.2
          for: 10m
          labels:
            severity: ticket
            slo: latency
          annotations:
            summary: "Read p95 latency above 200 ms"
            description: "Investigate DB pool / external dependency degradation."

        # ── Pipeline backlog ───────────────────────────────────────────
        - alert: SIAPipelineLag
          expr: sia_stream_lag{stream="raw_intel_stream"} > 1000
          for: 10m
          labels:
            severity: ticket
            slo: pipeline
          annotations:
            summary: "raw_intel_stream backlog > 1000"
            description: "Consumer can't keep up; check sia-consumer logs / scale up."

        # ── LLM degraded ────────────────────────────────────────────────
        - alert: SIALLMErrorRateHigh
          expr: sia:llm_error_ratio:5m > 0.20
          for: 10m
          labels:
            severity: ticket
            slo: llm
          annotations:
            summary: "LLM error ratio above 20%"
            description: "Failover should be active; check provider health and circuit breakers."

        # ── Circuit open ────────────────────────────────────────────────
        - alert: SIACircuitOpen
          expr: sia_circuit_state == 2
          for: 5m
          labels:
            severity: ticket
          annotations:
            summary: "Circuit breaker {{`{{ $labels.name }}`}} OPEN"
            description: "Investigate provider availability."
{{- end }}
