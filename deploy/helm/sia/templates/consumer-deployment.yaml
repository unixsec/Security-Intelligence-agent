apiVersion: apps/v1
kind: Deployment
metadata:
  name: sia-consumer
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "sia.labels" . | nindent 4 }}
    app.kubernetes.io/component: consumer
spec:
  replicas: {{ .Values.consumer.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: sia
      app.kubernetes.io/component: consumer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sia
        app.kubernetes.io/component: consumer
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- include "sia.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- include "sia.podSecurityContext" . | nindent 8 }}
      {{- include "sia.topologySpread" (dict "component" "consumer") | nindent 6 }}
      terminationGracePeriodSeconds: {{ .Values.consumer.terminationGracePeriodSeconds | default 90 }}
      volumes:
        {{- include "sia.writableVolumes" . | nindent 8 }}
        {{- include "sia.secretsVolume" . | nindent 8 }}
        {{- include "sia.tlsVolumes" . | nindent 8 }}
      containers:
        - name: sia-consumer
          image: {{ include "sia.image" (dict "global" .Values.global "image" .Values.consumer.image "chartVersion" .Chart.AppVersion) }}
          imagePullPolicy: {{ .Values.consumer.image.pullPolicy }}
          securityContext:
            {{- include "sia.containerSecurityContext" . | nindent 12 }}
          command: ["python", "-c"]
          args:
            - |
              import asyncio
              from sia.analyzer.pipeline import run_analysis_consumer
              asyncio.run(run_analysis_consumer())
          envFrom:
            - configMapRef:
                name: sia-config
          env:
            {{- include "sia.backendEnv" . | nindent 12 }}
          volumeMounts:
            {{- include "sia.writableVolumeMounts" . | nindent 12 }}
            {{- include "sia.secretsVolumeMount" . | nindent 12 }}
            {{- include "sia.tlsVolumeMounts" . | nindent 12 }}
          resources:
            {{- toYaml .Values.consumer.resources | nindent 12 }}
