# =============================================================================
# SIA Helm Chart — Default Values
#
# Enterprise deployments should NOT edit this file. Instead:
#   1. Fill deploy/deployment.config.example.yaml (copied to deployment.config.yaml)
#   2. Run  ./scripts/deploy/configure.sh --generate-secrets
#      — it produces deploy/helm/sia/values-prod.yaml + rendered secrets.
# =============================================================================

global:
  imageRegistry: ""           # e.g. "registry.company.com/sia"
  imagePullSecrets: []
  # v0.4-8: region tag injected as SIA_REGION; combine with
  # SIA_REGION_IDENTITY_PRIMARY (set per cluster) to enforce
  # active-active identity write-pinning.
  region: "default"
  identityPrimaryRegion: "default"

namespace: sia

# DEP-3: when true, Helm renders the namespace itself with Pod Security
# Standards labels (restricted profile). Leave false if your operations
# create the namespace via kubectl/Argo before helm runs (the default).
namespaceManagedByHelm: false

# =============================================================================
# Backend API
# =============================================================================
api:
  replicaCount: 2
  image:
    repository: sia-backend
    tag: ""                   # defaults to .Chart.AppVersion
    pullPolicy: IfNotPresent
  command: []
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits:   { cpu: 2000m, memory: 2Gi }
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPU: 70
    targetMemory: 80
  service:
    type: ClusterIP
    port: 8080
  probes:
    liveness:
      path: /api/v1/health
      initialDelaySeconds: 15
      periodSeconds: 30
      timeoutSeconds: 10
    readiness:
      path: /api/v1/health
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
    startup:
      path: /api/v1/health
      initialDelaySeconds: 5
      periodSeconds: 5
      failureThreshold: 12
  podDisruptionBudget:
    minAvailable: 1

# =============================================================================
# Analysis Consumer
# =============================================================================
consumer:
  replicaCount: 1
  image:
    repository: sia-backend
    tag: ""
    pullPolicy: IfNotPresent
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits:   { cpu: 1000m, memory: 1Gi }
  terminationGracePeriodSeconds: 90   # SEC-018

# =============================================================================
# Frontend (Nginx, unprivileged)
# =============================================================================
web:
  enabled: true
  replicaCount: 1
  image:
    repository: sia-web
    tag: ""
    pullPolicy: IfNotPresent
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits:   { cpu: 500m, memory: 256Mi }
  service:
    type: ClusterIP
    port: 80                  # Service port; container now listens on 8080

# =============================================================================
# Ingress
# =============================================================================
# DEP-1: TLS is REQUIRED by default. Disabling it (e.g. for a localhost dev
# install) requires explicit override AND config.env != "production"; see
# templates/ingress.yaml fail() guard.
ingress:
  enabled: true
  className: nginx
  annotations: {}             # cert-manager.io/cluster-issuer: letsencrypt-prod
  host: sia.example.com
  tls:
    enabled: true
    secretName: sia-tls

# =============================================================================
# Application Config (non-secret)
# =============================================================================
config:
  env: production
  logLevel: INFO
  apiHost: "0.0.0.0"
  apiPort: "8080"
  promptsDir: /app/prompts
  workflowsDir: /app/workflows
  configDir: /app/config
  jwtAlgorithm: HS256         # HS256 | RS256

# =============================================================================
# External MySQL
# =============================================================================
mysql:
  host: sia-mysql
  port: "3306"
  user: sia
  database: sia
  poolSize: "10"
  tls:
    mode: disabled            # disabled | preferred | required
    caPath: "/etc/sia/tls/mysql/ca.crt"
    caSecretName: ""          # K8s Secret with key "ca.crt"

# =============================================================================
# External Redis
# =============================================================================
redis:
  host: sia-redis
  port: "6379"
  db: "0"
  tls:
    enabled: false
    caPath: "/etc/sia/tls/redis/ca.crt"
    caSecretName: ""

# =============================================================================
# Milvus
# =============================================================================
milvus:
  host: sia-milvus
  port: "19530"
  collectionName: intel_vectors

# =============================================================================
# MinIO
# =============================================================================
minio:
  enabled: true
  host: sia-minio
  port: "9000"
  bucket: sia-reports
  secure: true

# =============================================================================
# Network policy
# =============================================================================
# DEP-1: in production this MUST be an explicit allow-list of upstream
# CIDRs (LLM providers, threat-feed APIs, your registry mirrors). The
# template guard refuses ``["0.0.0.0/0"]`` when config.env == "production".
network:
  egressAllowedCidrs:
    - "0.0.0.0/0"             # OK for dev only; tighten before prod (DEP-1)

# =============================================================================
# Observability
# =============================================================================
observability:
  otlpEndpoint: ""
  logJsonFormat: true
  # OBS-1: Prometheus Operator ServiceMonitor. Set enabled=true when the
  # cluster already has the operator installed; otherwise scrape via
  # prom-annotations on the Pod (see api-deployment.yaml).
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    additionalLabels: {}
  # v0.4-6: Prometheus SLO rules + multi-window burn-rate alerts.
  prometheusRule:
    enabled: false
    additionalLabels: {}

# =============================================================================
# Security add-ons (require operator-level components in cluster)
# =============================================================================
# DEP-2: Gatekeeper constraints are turned on by default. ``deploy-k8s.sh``
# detects whether the cluster has the Gatekeeper CRDs installed and skips
# the apply step gracefully when it doesn't, so this default is safe for
# clusters that haven't (yet) installed Gatekeeper.
security:
  falcoRulesEnabled: false
  gatekeeperConstraintsEnabled: true

# =============================================================================
# Secrets
#   Default path: separate Secret manifest rendered by configure.sh, applied
#   via kubectl apply -f deploy/rendered/sia-secrets.yaml.
#   Set manageInChart=true ONLY for manual installs without configure.sh.
# =============================================================================
secrets:
  manageInChart: false
  jwtSecret: ""
  jwtAlgorithm: HS256
  jwtPrivateKey: ""
  jwtPublicKey: ""
  apiKey: ""
  adminPassword: ""
  mysqlPassword: ""
  redisPassword: ""
  minioAccessKey: ""
  minioSecretKey: ""
  milvusToken: ""
  googleApiKey: ""
  anthropicApiKey: ""
  openaiApiKey: ""

# =============================================================================
# Argo Rollouts (canary) — v0.4-5
# When enabled, the api Deployment is replaced by an argoproj.io/v1alpha1
# Rollout. Cluster must already have the Argo Rollouts controller installed.
# =============================================================================
rollouts:
  enabled: false
  pauseSeconds: 60
  analysis:
    enabled: false
    # Prometheus URL the AnalysisRun queries. Typical in-cluster value:
    prometheusUrl: "http://prometheus.monitoring.svc.cluster.local:9090"
    # Max acceptable 5xx error rate during a canary step (fraction).
    maxErrorRate: 0.02

# =============================================================================
# Post-install jobs
# =============================================================================
jobs:
  migration:
    enabled: true
  seed:
    enabled: true

# =============================================================================
# Recurring CronJobs — backup, audit verification, reconciliation
# =============================================================================
backup:
  enabled: true
  # UTC cron — "15 2 * * *" = 02:15 UTC (10:15 CST, off-peak)
  schedule: "15 2 * * *"
  timeZone: "UTC"
  # Bind-mount a PVC for backups. If left blank, an emptyDir is used and
  # backups disappear with the pod — only safe for pre-prod validation.
  persistentVolumeClaim: ""

audit:
  verifyChain:
    enabled: true
    # 03:00 UTC daily. Exits non-zero on any broken chain link; K8s surfaces
    # failed CronJob via kube-state-metrics.
    schedule: "0 3 * * *"
    timeZone: "UTC"

reconcile:
  enabled: true
  # Every 15 minutes. Re-queues orphaned 'analyzing' intelligence rows.
  schedule: "*/15 * * * *"
  timeZone: "UTC"
  olderThan: "15m"
