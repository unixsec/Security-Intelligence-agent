# =============================================================================
# SIA Authentication Configuration
# Environment variables override: SIA_AUTH_<key>
# =============================================================================

# JWT settings
# -------------------------------------------------------------------
# secret_key / algorithm / keys are loaded from K8s Secret or env var.
# No defaults — production startup fails if SIA_AUTH_JWT_SECRET (HS256)
# or SIA_AUTH_JWT_PRIVATE_KEY + SIA_AUTH_JWT_PUBLIC_KEY (RS256) are unset.
# See src/sia/config.py:AuthSecretSettings.
# -------------------------------------------------------------------
jwt:
  secret_key: "${SIA_AUTH_JWT_SECRET}"
  algorithm: "${SIA_AUTH_JWT_ALGORITHM:-HS256}"   # HS256 | RS256
  private_key: "${SIA_AUTH_JWT_PRIVATE_KEY}"       # base64-encoded PEM, only for RS256
  public_key: "${SIA_AUTH_JWT_PUBLIC_KEY}"         # base64-encoded PEM, only for RS256
  access_token_expire_minutes: 30
  refresh_token_expire_days: 7

# Account lockout policy
lockout:
  max_failed_attempts: 5
  lockout_duration_minutes: 30

# Password policy
password:
  min_length: 8
  require_uppercase: true
  require_lowercase: true
  require_digit: true
  require_special: false

# OIDC providers (multiple supported)
# Uncomment and configure for your identity provider
oidc:
  enabled: false
  providers:
    # Example: Azure AD
    # azure:
    #   display_name: "Azure AD SSO"
    #   issuer: "https://login.microsoftonline.com/{tenant-id}/v2.0"
    #   client_id: "${SIA_OIDC_AZURE_CLIENT_ID}"
