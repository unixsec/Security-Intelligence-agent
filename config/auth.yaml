    #   issuer: "https://keycloak.company.com/realms/sia"
    #   client_id: "${SIA_OIDC_KC_CLIENT_ID}"
    #   client_secret: "${SIA_OIDC_KC_CLIENT_SECRET}"
    #   scopes: ["openid", "profile", "email"]
