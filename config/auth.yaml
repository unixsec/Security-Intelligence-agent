    #   role_mapping:
    #     sia-admin: "admin"
    #     sia-analyst: "analyst"

# LDAP / Active Directory
ldap:
  enabled: false
  # server: "ldap://ldap.company.com:389"
  # use_ssl: false
  # start_tls: true
  # bind_dn: "CN=sia-service,OU=Services,DC=company,DC=com"
  # bind_password: "${SIA_LDAP_BIND_PASSWORD}"
  # user_search_base: "OU=Users,DC=company,DC=com"
  # user_search_filter: "(sAMAccountName={username})"
