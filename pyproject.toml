[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sia"
version = "0.2.0"
description = "Security Intelligence Agent - 安全洞察与情报分析智能体"
authors = [{name = "alex", email = "unix_sec@163.com"}]
requires-python = ">=3.11"
license = {text = "Proprietary"}

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "aiomysql>=0.2.0",
    "alembic>=1.13.0",

    # Redis
    "redis[hiredis]>=5.0.0",

    # Milvus
    "pymilvus>=2.4.0",

    # MinIO
    "minio>=7.2.0",

    # HTTP client
    "httpx>=0.27.0",

    # Async SMTP (email push channel)
    "aiosmtplib>=3.0.0",

    # LLM SDKs
    "openai>=1.50.0",
    "anthropic>=0.39.0",
    "google-generativeai>=0.8.0",

    # RSS parsing
    "feedparser>=6.0.0",

    # Web crawling
    "crawl4ai>=0.4.0",

    # Template rendering
    "jinja2>=3.1.0",

    # PDF generation
    "weasyprint>=62.0",

    # NLP
    "langdetect>=1.0.9",

    # YAML
    "pyyaml>=6.0",

    # File watching (prompt hot-reload)
    "watchdog>=4.0.0",

    # Observability
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "prometheus-client>=0.21.0",

    # Scheduling
    "apscheduler>=3.10.0",

    # Auth
    "passlib[bcrypt]>=1.7.4",
    "PyJWT>=2.9.0",
    "authlib>=1.3.0",
    "ldap3>=2.9.0",

    # Embedding model
    "sentence-transformers>=3.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.0",
    "testcontainers[mysql,redis]>=4.0.0",
    "schemathesis>=3.30.0",
    "factory-boy>=3.3.0",
    "respx>=0.21.0",
]
dev = [
    "ruff>=0.7.0",
    "mypy>=1.12.0",
    "pre-commit>=3.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow",
    "integration: marks integration tests",
    "e2e: marks end-to-end tests",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
