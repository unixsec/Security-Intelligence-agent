name: Deploy

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: staging
        type: choice
        options: [staging, production]
      tag:
        description: "Image tag override (default: git tag)"
        required: false
        type: string

env:
  REGISTRY: ${{ vars.SIA_IMAGE_REGISTRY }}

permissions:
  contents: read
  packages: write
  id-token: write   # required for cosign keyless signing (OIDC)

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      backend_digest: ${{ steps.push_backend.outputs.digest }}
      web_digest: ${{ steps.push_web.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine tag
        id: meta
        run: |
          if [[ -n "${{ inputs.tag }}" ]]; then
            echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "tag=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          fi

      - uses: docker/setup-buildx-action@v4

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build & push backend
        id: push_backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/sia-backend:${{ steps.meta.outputs.tag }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        id: push_web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/docker/Dockerfile.web
          push: true
          tags: ${{ env.REGISTRY }}/sia-web:${{ steps.meta.outputs.tag }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Supply-chain security (SEC-011) ──────────────────────────────
      - name: Trivy — scan backend image
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.REGISTRY }}/sia-backend:${{ steps.meta.outputs.tag }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Trivy — scan web image
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.REGISTRY }}/sia-web:${{ steps.meta.outputs.tag }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Generate SBOM (Syft) — backend
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/sia-backend:${{ steps.meta.outputs.tag }}
          format: cyclonedx-json
          output-file: sbom-backend.cdx.json

      - name: Generate SBOM (Syft) — web
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/sia-web:${{ steps.meta.outputs.tag }}
          format: cyclonedx-json
          output-file: sbom-web.cdx.json

      - uses: sigstore/cosign-installer@v3

      - name: Cosign — keyless sign backend (OIDC)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes \
            ${{ env.REGISTRY }}/sia-backend@${{ steps.push_backend.outputs.digest }}

      - name: Cosign — keyless sign web (OIDC)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes \
            ${{ env.REGISTRY }}/sia-web@${{ steps.push_web.outputs.digest }}

      - name: Cosign — attest SBOM (backend)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign attest --yes --type cyclonedx --predicate sbom-backend.cdx.json \
            ${{ env.REGISTRY }}/sia-backend@${{ steps.push_backend.outputs.digest }}

      - name: Cosign — attest SBOM (web)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign attest --yes --type cyclonedx --predicate sbom-web.cdx.json \
            ${{ env.REGISTRY }}/sia-web@${{ steps.push_web.outputs.digest }}

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ steps.meta.outputs.tag }}
          path: |
            sbom-backend.cdx.json
            sbom-web.cdx.json

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      - name: Configure kubectl
        uses: azure/k8s-set-context@v4
        with:
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Apply sealed secrets / external-secrets
        # Secrets are expected to already exist in the cluster as K8s Secret
        # `sia-secrets`, managed by sealed-secrets/external-secrets/Vault Agent.
        # See docs/DEPLOYMENT_GUIDE.md §7 (Secret Management).
        run: kubectl -n sia get secret sia-secrets

      - name: Deploy via Helm
        run: |
          helm upgrade --install sia deploy/helm/sia/ \
            --namespace sia \
            --create-namespace \
            -f deploy/helm/sia/values-prod-example.yaml \
            --set "global.imageRegistry=${{ env.REGISTRY }}" \
            --set "api.image.tag=${{ needs.build-and-push.outputs.image_tag }}" \
            --set "consumer.image.tag=${{ needs.build-and-push.outputs.image_tag }}" \
            --set "web.image.tag=${{ needs.build-and-push.outputs.image_tag }}" \
            --wait --timeout 5m

      - name: Verify
        run: |
          kubectl rollout status deployment/sia-api -n sia --timeout=120s
          kubectl get pods -n sia
